<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PSLE English AL1 Master Portal (2025 Full Top Schools Edition)</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 12px; }
    .container { max-width: 480px; margin: 0 auto; min-height: 94vh; display: flex; flex-direction: column; justify-content: space-between; }
    
    .app-switcher { display: flex; background: #e2e8f0; padding: 4px; border-radius: 14px; margin-bottom: 10px; gap: 4px; }
    .app-btn { flex: 1; padding: 9px 4px; font-size: 12.5px; font-weight: 800; border-radius: 10px; border: none; background: transparent; color: #64748b; cursor: pointer; transition: all 0.2s; text-align: center; }
    .app-btn.active.spelling { background: #7e22ce; color: #ffffff; box-shadow: 0 2px 4px rgba(126,34,206,0.25); }
    .app-btn.active.cloze { background: #0284c7; color: #ffffff; box-shadow: 0 2px 4px rgba(2,132,199,0.25); }
    .app-btn.active.speed { background: #dc2626; color: #ffffff; box-shadow: 0 2px 4px rgba(220,38,38,0.25); }

    .tool-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cloud-status { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 4px; }
    .cloud-live { background: #dcfce7; color: #15803d; }
    .cloud-local { background: #f1f5f9; color: #475569; }

    .card { background: #ffffff; border-radius: 18px; padding: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; margin-bottom: 12px; }
    .badge-cat { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .badge-cat.spelling { background: #f3e8ff; color: #7e22ce; }
    .badge-cat.cloze { background: #e0f2fe; color: #0369a1; }
    .badge-cat.speed { background: #fee2e2; color: #dc2626; }
    
    .sentence-box { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 14px; font-size: 15px; line-height: 1.65; margin: 12px 0; color: #0f172a; position: relative; }
    .error-target { color: #e11d48; background: #ffe4e6; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-decoration: underline wavy #f43f5e; }
    .blank-target { color: #0284c7; background: #e0f2fe; padding: 2px 8px; border-radius: 6px; font-weight: 700; border-bottom: 2px solid #0284c7; }

    .audio-btn { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .audio-btn:active { background: #e2e8f0; }

    input[type="text"] { width: 100%; font-size: 16px; font-weight: 600; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; margin-bottom: 6px; }
    input[type="text"]:focus { outline: none; border-color: #7e22ce; box-shadow: 0 0 0 3px #f3e8ff; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .opt-btn { width: 100%; text-align: center; padding: 11px 8px; font-size: 14px; font-weight: 700; border-radius: 12px; border: 1.5px solid #cbd5e1; background: #ffffff; color: #334155; cursor: pointer; transition: all 0.15s; }
    .opt-btn.selected { border-color: #0284c7; background: #f0f9ff; color: #0369a1; }
    .opt-btn.correct { border-color: #10b981; background: #ecfdf5; color: #065f46; font-weight: 800; }
    .opt-btn.wrong { border-color: #f43f5e; background: #fff1f2; color: #9f1239; }

    .btn { width: 100%; color: #ffffff; font-weight: 700; font-size: 15px; padding: 14px; border: none; border-radius: 14px; cursor: pointer; transition: all 0.15s; }
    .btn.spelling { background: #7e22ce; }
    .btn.cloze { background: #0284c7; }
    .btn.speed { background: #dc2626; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    .sub-tabs { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
    .tab-pill { flex: 1; min-width: 65px; padding: 6px 2px; font-size: 11px; font-weight: 700; border-radius: 8px; border: 1px solid #e2e8f0; background: #ffffff; color: #64748b; cursor: pointer; text-align: center; white-space: nowrap; }
    .tab-pill.active.spelling { background: #7e22ce; color: #fff; border-color: #7e22ce; }
    .tab-pill.active.cloze { background: #0284c7; color: #fff; border-color: #0284c7; }
    .tab-pill.active.speed { background: #dc2626; color: #fff; border-color: #dc2626; }

    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; text-align: center; }
    .stat-item { background: #ffffff; padding: 8px 4px; border-radius: 14px; border: 1px solid #f1f5f9; }
    .stat-val { font-size: 16px; font-weight: 800; }
    .stat-lbl { font-size: 9px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

    .result-box { padding: 13px; border-radius: 12px; font-size: 13px; line-height: 1.55; margin-top: 10px; }
    .result-correct { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .result-retry { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
    .result-wrong { background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; }
    .tip-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(0,0,0,0.1); font-size: 12px; }
    .timer-pill { display: inline-flex; align-items: center; gap: 4px; background: #fee2e2; color: #dc2626; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 10px; }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .container { max-width: 100%; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .worksheet-item { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 10px 0; font-size: 14pt; }
    }
    .print-only { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="no-print">
      <div class="app-switcher">
        <button id="swSpelling" class="app-btn active spelling" onclick="switchApp('spelling')">✍️ Editing & Spelling</button>
        <button id="swCloze" class="app-btn" onclick="switchApp('cloze')">📖 Cloze Top 300</button>
        <button id="swSpeed" class="app-btn" onclick="switchApp('speed')">⚡ Speed Trial</button>
      </div>

      <div class="tool-bar">
        <div style="display:flex; align-items:center; gap:6px;">
          <span id="cloudStatus" class="cloud-status cloud-live">☁️ 云端已同步</span>
          <span id="timerContainer" style="display:none;" class="timer-pill">⏱️ <span id="timerSec">45</span>s</span>
        </div>
        <div style="display:flex; gap:6px;">
          <button onclick="promptParentEdit()" style="font-size:11px; font-weight:700; background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; padding:3px 8px; cursor:pointer;">⚙️ 家长调分</button>
          <button onclick="openPrintModal()" style="font-size:11px; font-weight:700; background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; padding:3px 8px; cursor:pointer;">🖨️ 导出</button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-item"><div class="stat-lbl">Stars ⭐</div><div id="statStars" class="stat-val" style="color:#eab308;">0</div></div>
        <div class="stat-item"><div class="stat-lbl">Mastered</div><div id="statMastered" class="stat-val" style="color:#059669;">0</div></div>
        <div class="stat-item"><div class="stat-lbl">In Review</div><div id="statReview" class="stat-val" style="color:#d97706;">0</div></div>
        <div class="stat-item"><div id="statDoneLabel" class="stat-lbl">Editing Today</div><div id="statDone" class="stat-val" style="color:#7e22ce;">0/20</div></div>
      </div>

      <div class="sub-tabs">
        <button id="tabDaily" class="tab-pill active spelling" onclick="changeMode('daily')">Daily 20 Qs</button>
        <button id="tabReview" class="tab-pill" onclick="changeMode('review')">Review (<span id="revCount">0</span>)</button>
        <button id="tabFormat" class="tab-pill" onclick="toggleClozeFormat()" style="display:none;">Mode: <span id="formatLabel">MCQ</span></button>
        <button id="tabAll" class="tab-pill" onclick="changeMode('all')">All Library</button>
        <button id="tabHistory" class="tab-pill" onclick="changeMode('history')">History Log</button>
      </div>

      <div id="quizView" class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div>
            <span id="qCategory" class="badge-cat spelling"></span>
            <span id="attemptDisplay" style="display:inline-block; font-size:10px; font-weight:800; padding:2px 7px; border-radius:10px; margin-left:6px; background:#e2e8f0; color:#475569;">Attempt 1/2</span>
          </div>
          <span id="qIndex" style="font-size:12px; color:#94a3b8; font-weight:700;"></span>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <div id="qSource" style="font-size:11px; color:#64748b; font-weight:600;"></div>
          <button class="audio-btn" onclick="speakTargetSentence()">🔊 Read British</button>
        </div>

        <div style="font-size:11px; color:#64748b; font-weight:600;" id="qInstruction"></div>
        <div id="sentenceContainer" class="sentence-box"></div>

        <div id="spellingInputArea" style="position:relative;">
          <input type="text" id="answerInput" placeholder="Type correct spelling..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>

        <div id="clozeOptionsArea" class="options-grid" style="display:none;"></div>

        <div id="clozeProInputArea" style="display:none;">
          <div style="font-size:12px; color:#0369a1; font-weight:700; margin-bottom:4px;">Pro Open-ended Mode (Type exact word):</div>
          <input type="text" id="clozeProInput" placeholder="e.g. out, at, down..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin: 4px 0 8px 0;">
          <span id="attemptTip" style="font-size:11px; color:#94a3b8; font-weight:600;">🔒 Hint unlocks on 2nd attempt</span>
          <button id="hintBtn" disabled onclick="toggleHint()" style="background:#f1f5f9; border:none; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; color:#94a3b8; cursor:not-allowed;">🔒 Hint (Locked)</button>
        </div>

        <div id="hintBox" style="display:none; background:#fffbeb; border:1.5px solid #fef08a; color:#92400e; padding:10px; border-radius:10px; font-size:12px; margin-bottom:8px;"></div>
        <div id="resultContainer" style="display:none;" class="result-box"></div>
      </div>

      <div id="historyView" style="display:none;">
        <div class="card">
          <h3 style="margin-top:0; font-size:14px; font-weight:800; color:#0f172a; margin-bottom:10px;">📅 Real 1st-Attempt Accuracy Log</h3>
          <div id="historyListContainer"></div>
        </div>
      </div>

      <div id="btnContainer" style="margin-top:10px;">
        <button id="actionBtn" class="btn spelling" onclick="handleAction()">Check Answer (Attempt 1)</button>
      </div>
    </div>

    <div id="printSheet" class="print-only">
      <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px;">
        <h2 style="margin:0; font-size:18pt;">PSLE English Weak Words Revision Worksheet</h2>
        <p style="margin:4px 0 0 0; font-size:11pt;">Name: ____________________ Date: ________________ Score: ______ / ______</p>
      </div>
      <div id="printListContainer"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC069kigwWahvR7nCzLbwRMTVpwr1qF30k",
      authDomain: "psle-tracker-51fac.firebaseapp.com",
      databaseURL: "https://psle-tracker-51fac-default-rtdb.firebaseio.com",

      appId: "1:948024980257:web:401fa9eb51dce06d0a4460",

    } catch(e) {

    // 零删减完整保留原有词库 + 全量 2025 名校新增真题 (去重后 88 题真实真题库)
    const SPELLING_DB = [
      {"word": "accommodation", "cat": "Double Consonants", "sub": "Double 'c' & Double 'm'", "src": "P5 Editing Core", "sent": "The tour agency arranged comfortable [acomodation] for all travellers near the airport.", "feat": "Double 'c' AND double 'm': ac + com + mo + da + tion.", "tip": "A hotel needs room for 2 Cats (cc) and 2 Monkeys (mm)!"},
      {"word": "admitted", "cat": "Double Consonants", "sub": "Double 't' in past tense", "src": "P5 Grammar & Editing", "sent": "The guilty boy lowered his head and [admited] that he had broken the window.", "feat": "Double 't': ad + mit + ted (CVC doubling rule before '-ed').", "tip": "Short vowel /ɪ/ before 't' means double the 't' before adding '-ed'."},
      {"word": "applause", "cat": "Double Consonants", "sub": "Double 'p'", "src": "2025 Tao Nan P5 EOY *", "sent": "Thunderous [apllause] erupted throughout the concert hall when the choir bowed.", "feat": "Double 'p', diphthong 'au', ends in '-se': ap + plause.", "tip": "Remember 'ap-' prefix doubles the 'p' before 'plause'."},
      {"word": "attack", "cat": "Double Consonants", "sub": "Double 't'", "src": "P5 Editing Core", "sent": "The guards were trained to defend the castle against any sudden [atack].", "feat": "Double 't' and ends in 'ck': at + tack.", "tip": "Prefix 'at-' attaches to 'tack' -> always double 't'."},
      {"word": "bellowed", "cat": "Double Consonants", "sub": "Double 'l'", "src": "P5 Narrative Vocabulary", "sent": "\"Silence in the hall!\" the angry captain [belowed] at the top of his voice.", "feat": "Double 'l': bel + low + ed.", "tip": "Rhymes with 'yellow' and 'fellow' — both have double 'l'."},
      {"word": "beginning", "cat": "Double Consonants", "sub": "Double 'n'", "src": "P5 Editing Trap", "sent": "At the very [begining] of the ceremony, the national anthem was played.", "feat": "Single 'g', but double 'n': be + gin + ning.", "tip": "Stress on second syllable (be-GIN) -> double the final 'n'."},
      {"word": "brilliant", "cat": "Double Consonants", "sub": "Double 'l'", "src": "P5 Descriptive Core", "sent": "The young scientist devised a [briliant] solution to filter contaminated river water.", "feat": "Double 'l' and '-iant' ending: bril + liant.", "tip": "Watch out for single 'l' error; like 'million', it has double 'l'."},
      {"word": "committee", "cat": "Double Consonants", "sub": "Double 'm', 't', and 'e'", "src": "Top Primary Schools", "sent": "The organising [comitee] held an emergency meeting to finalise the timetable.", "feat": "Three doubles: com + mit + tee (double 'm', 't', and 'e').", "tip": "A committee needs 2 Members (mm), 2 Teas (tt), and 2 Eggs (ee)!"},
      {"word": "commitment", "cat": "Double Consonants", "sub": "Double 'm' & Single 't'", "src": "2024 Tao Nan P5 EOY *", "sent": "The athletes showed unwavering [comitment] to their daily training routines.", "feat": "Double 'm', but SINGLE 't': com + mit + ment.", "tip": "Do not confuse with 'committee'! 'Commitment' has only ONE 't'."},
      {"word": "colleagues", "cat": "Double Consonants", "sub": "Double 'l' & '-gues'", "src": "2024 Pei Chun P5 EOY *", "sent": "Mr. Tan joined his [colleages] at the cafeteria for a quick lunch.", "feat": "Double 'l', diphthong 'ea', silent ending '-gues': col + leagues.", "tip": "Prefix 'col-' + 'league'. Keep '-ue' before 's'."},

      {"word": "disappointed", "cat": "Double Consonants", "sub": "Single 's' & Double 'p'", "src": "2026 EYE Q37b *", "sent": "Mother was visibly [dissapointed] when she discovered the broken heirloom vase.", "feat": "Single 's', double 'p': dis + ap + point + ed.", "tip": "Prefix 'dis-' (1 's') + 'appoint' (2 'p's). Never double the 's'!"},
      {"word": "disapproval", "cat": "Double Consonants", "sub": "Single 's' & Double 'p'", "src": "P5 Word Form Core *", "sent": "Father shook his head in strong [dissaproval] at my careless attitude.", "feat": "Single 's', double 'p': dis + ap + prov + al.", "tip": "Prefix 'dis-' + 'approval'. One 's' and two 'p's."},
      {"word": "dropped", "cat": "Double Consonants", "sub": "Double 'p'", "src": "2026 EYE Q20 *", "sent": "The clumsy boy accidentally [droped] his pencil case down the stairwell.", "feat": "Double 'p': drop + p + ed (1-1-1 doubling rule).", "tip": "Short vowel /ɒ/ followed by 'p' -> double the 'p' before '-ed'."},
      {"word": "effort", "cat": "Double Consonants", "sub": "Double 'f'", "src": "P5 Editing Core", "sent": "With collective [efort], the students managed to build the camp bonfire in an hour.", "feat": "Double 'f': ef + fort.", "tip": "From Latin 'ex-' + 'fortis' -> changes to double 'f' ('ef-fort')."},
      {"word": "embarrassment", "cat": "Double Consonants", "sub": "Double 'r' & Double 's'", "src": "P5 Top School Editing *", "sent": "To avoid further [embarasment], Jeremy lowered his gaze and hurried away.", "feat": "Double 'r' AND double 's': em + bar + rass + ment.", "tip": "You turn Red (2 'r's) and Shy (2 's's) in embarrassment!"},

      {"word": "equipped", "cat": "Double Consonants", "sub": "Double 'p'", "src": "P5 Editing Core", "sent": "The new science lab is fully [equiped] with microscopes and safety goggles.", "feat": "Double 'p': e + quipped (short vowel /ɪ/ before 'p').", "tip": "Single final consonant 'p' doubles before '-ed'."},
      {"word": "immediately", "cat": "Double Consonants", "sub": "Double 'm'", "src": "P5 High-Frequency Spelling", "sent": "The paramedics rushed to the scene [imediately] after receiving the emergency call.", "feat": "Double 'm', ends in '-ely': im + me + di + ate + ly.", "tip": "Prefix 'im-' + root 'mediate' + '-ly'. Don't drop the 'e'!"},
      {"word": "interrupted", "cat": "Double Consonants", "sub": "Double 'r'", "src": "P5 Grammar & Editing *", "sent": "The loud fire siren [interupted] the teacher in the middle of her explanation.", "feat": "Double 'r': inter + rupt + ed.", "tip": "Root 'rupt' (to break) + prefix 'inter-' -> double 'r'."},
      {"word": "occurrence", "cat": "Double Consonants", "sub": "Double 'c' & Double 'r'", "src": "PSLE & Top Schools Editing *", "sent": "The unexpected [occurance] of flash floods caused traffic delays islandwide.", "feat": "Double 'c' AND double 'r', ending in '-ence': oc + cur + rence.", "tip": "Double 'c', double 'r', and ends in '-ENCE' (never '-ance')!"},

      {"word": "parallel", "cat": "Double Consonants", "sub": "Double 'l' in the middle", "src": "P5 Tricky Spelling", "sent": "The railway tracks ran [paralel] to the scenic coastal highway for miles.", "feat": "Single 'r', double 'l' in the middle: par + al + lel.", "tip": "The two parallel 'l's stand side-by-side in the middle!"},
      {"word": "planned", "cat": "Double Consonants", "sub": "Double 'n'", "src": "P5 Editing Core", "sent": "They [planed] a surprise birthday celebration for their class form teacher.", "feat": "Double 'n': plan + n + ed.", "tip": "'Planed' means shaved wood! Double 'n' for 'planned'."},
      {"word": "possession", "cat": "Double Consonants", "sub": "Double 's' & Double 's'", "src": "PSLE High-Frequency Spelling", "sent": "The antique pocket watch was the old grandfather's most treasured [posession].", "feat": "Double 's' TWICE: pos + ses + sion (4 's's total).", "tip": "Two 's's in the middle, and two 's's before '-ion'."},
      {"word": "recommended", "cat": "Double Consonants", "sub": "Single 'c' & Double 'm'", "src": "P5 Editing Trap", "sent": "The librarian [recomended] an exciting mystery novel to the avid reader.", "feat": "Single 'c', double 'm': re + com + mend + ed.", "tip": "Commend has double 'm', but 're-' has only one 'c'!"},
      {"word": "rummage", "cat": "Double Consonants", "sub": "Double 'm'", "src": "PSLE 2019, 2021", "sent": "The detective began to [rumage] through the messy drawers for vital clues.", "feat": "Double 'm': rum + mage.", "tip": "Short /ʌ/ vowel requires doubling the 'm' before '-age'."},

      { id: "c2025_19", phrase: "blend in with", cat: "Phrasal Verb", sent: "A tiger's orange and black stripes help it blend [ ______ ] the tall grasses of the jungle.", correct: "with", options: ["with", "in", "to", "at"], meaning: "To merge smoothly into the surrounding environment.", clue: "Camouflaging with surroundings: blend in ______.", exp: "'Blend in with' means to harmonize or camouflage with." },
      { id: "c2025_20", phrase: "set an example", cat: "Fixed Collocation", sent: "The monitor strove to set a commendable [ ______ ] for his peers by arriving punctually every day.", correct: "example", options: ["example", "pattern", "standard", "rule"], meaning: "To behave in a way that others should copy.", clue: "Being a role model: set an ______.", exp: "'Set an example' is the standard collocation for acting as a role model." },
      { id: "c2025_21", phrase: "neither ... nor", cat: "Connectors", sent: "The police suspected neither arson [ ______ ] any malicious intent to harm.", correct: "nor", options: ["nor", "or", "and", "but"], meaning: "Not one and not the other.", clue: "Fixed correlative conjunction: neither ______.", exp: "Correlative pair: 'neither' always pairs with 'nor'!" },
      { id: "c2025_22", phrase: "instead of", cat: "Prepositional Phrase", sent: "Instead [ ______ ] moving away, these clever wild foxes learn to thrive near human habitats.", correct: "of", options: ["of", "to", "for", "from"], meaning: "As an alternative or substitute to something.", clue: "Alternative action: instead ______.", exp: "Prepositional phrase 'instead of' is followed by a noun or gerund." },
      { id: "c2025_23", phrase: "unlike", cat: "Preposition", sent: "[ ______ ] some sports that require expensive gear, pickleball is easy and cheap to pick up.", correct: "unlike", options: ["unlike", "like", "against", "except"], meaning: "Different from; not typical of.", clue: "Showing contrast at the start of sentence: ______ some sports...", exp: "'Unlike' introduces a contrast with other sports." },
      { id: "c2025_24", phrase: "compared to", cat: "Collocation", sent: "Pickleball is gentler on elderly joints compared [ ______ ] high-impact sports like basketball.", correct: "to", options: ["to", "with", "against", "from"], meaning: "When considered in relation to another.", clue: "Comparison phrase: compared ______.", exp: "Standard collocation: 'compared to' (or 'compared with')." },
      { id: "c2025_25", phrase: "give it a try", cat: "Idiom & Collocation", sent: "Pickleball offers something for everyone, so why not give it a [ ______ ] this weekend?", correct: "try", options: ["try", "shot", "go", "test"], meaning: "To attempt or test doing something.", clue: "Collocation for attempting something: give it a ______.", exp: "Fixed idiom: 'give it a try' (or 'give it a shot')." },
      { id: "c2025_26", phrase: "role models", cat: "Collocation", sent: "Parents are encouraged to be good role [ ______ ] by keeping away devices during dinner.", correct: "models", options: ["models", "leaders", "examples", "figures"], meaning: "People whose behavior is imitated by others.", clue: "Compound noun: role ______.", exp: "Fixed collocation: 'role models'." },
      { id: "c2025_27", phrase: "play a part", cat: "Idiomatic Phrase", sent: "Society, schools and parents all have an important role to [ ______ ] in children's digital health.", correct: "play", options: ["play", "take", "make", "do"], meaning: "To be involved in an action and have an effect on it.", clue: "Fixed collocation with role: have a role to ______.", exp: "Collocation: 'play a part' or 'have a role to play'." },
      { id: "c2025_28", phrase: "due to", cat: "Cause & Effect", sent: "Around 40% of items in recycling bins cannot be processed due [ ______ ] food contamination.", correct: "to", options: ["to", "of", "from", "for"], meaning: "Because of; caused by.", clue: "Causal connector: due ______.", exp: "Prepositional connector: 'due to' means 'because of'." },
      { id: "c2025_29", phrase: "look beyond", cat: "Phrasal Verb", sent: "Consumers are advised to look [ ______ ] misleading claims and inspect official energy ratings.", correct: "beyond", options: ["beyond", "after", "through", "over"], meaning: "To consider other aspects rather than just what is obvious.", clue: "Seeing past surface appearances: look ______.", exp: "'Look beyond' means to see past superficial claims." },
      { id: "c2025_30", phrase: "make sense of", cat: "Idiomatic Phrase", sent: "Scientists believe that dreams help human minds make [ ______ ] of complex daily experiences.", correct: "sense", options: ["sense", "meaning", "order", "use"], meaning: "To comprehend or understand something.", clue: "Fixed idiom: make ______ of.", exp: "'Make sense of' means to understand or find meaning in something." },
      { id: "c2025_31", phrase: "for instance / example", cat: "Connectors", sent: "For [ ______ ], if you study diligently, your brain sorts what you learned during sleep.", correct: "instance", options: ["instance", "example", "case", "fact"], meaning: "As an illustration.", clue: "Common transition phrase: For ______.", exp: "'For instance' and 'For example' introduce illustrative evidence." },
      { id: "c2025_32", phrase: "solution to", cat: "Collocation", sent: "Have you ever awakened in the morning with a creative solution [ ______ ] a thorny problem?", correct: "to", options: ["to", "for", "with", "of"], meaning: "An answer to a problem.", clue: "Preposition following solution: solution ______.", exp: "Noun 'solution' takes the preposition 'to' (solution to a problem)." },
      { id: "c2025_33", phrase: "tell apart / tell", cat: "Collocation", sent: "Examining your recurring dreams might [ ______ ] you valuable clues about your inner thoughts.", correct: "tell", options: ["tell", "show", "give", "teach"], meaning: "To reveal information.", clue: "Disclose thoughts: ______ you something about your mind.", exp: "'Tell you something' conveys disclosing insights or truth." },
      { id: "c2025_34", phrase: "catch one's breath", cat: "Idiom", sent: "Passengers on the thrilling roller coaster tried to catch their [ ______ ] as they climbed the peak.", correct: "breath", options: ["breath", "air", "pace", "voice"], meaning: "To pause to rest until breathing normally again.", clue: "Fixed idiom: catch their ______.", exp: "'Catch one's breath' is a standard idiom for recovering normal breathing." },
      { id: "c2025_35", phrase: "look forward to", cat: "Grammar & Phrasal", sent: "The enthusiastic students had been looking [ ______ ] to visiting the theme park for weeks.", correct: "forward", options: ["forward", "ahead", "on", "out"], meaning: "To feel excited about something that is going to happen.", clue: "Anticipating with pleasure: looking ______ to.", exp: "Fixed three-part phrasal verb: 'look forward to' (+ gerund/noun)." },
      { id: "c2025_36", phrase: "sense of satisfaction", cat: "Collocation", sent: "Upon completing their handmade woodwork, makers gain a profound sense of [ ______ ].", correct: "satisfaction", options: ["satisfaction", "relief", "pride", "achievement"], meaning: "A feeling of fulfillment and happiness.", clue: "Feeling accomplished: a sense of ______.", exp: "'Sense of satisfaction' is a top-frequency PSLE emotional collocation." },
      { id: "c2025_37", phrase: "take pride in", cat: "Idiomatic Phrase", sent: "Skilled craftsmen take immense [ ______ ] in ensuring every joint and surface is polished.", correct: "pride", options: ["pride", "care", "honor", "delight"], meaning: "To feel very pleased with something one has created or achieved.", clue: "Fixed phrase: take ______ in.", exp: "'Take pride in' means to be proud of one's work or actions." },
      { id: "c2025_38", phrase: "second lease of life", cat: "Idiomatic Phrase", sent: "Donating pre-loved clothes gives these usable garments a second [ ______ ] of life.", correct: "lease", options: ["lease", "chance", "turn", "stage"], meaning: "A renewed opportunity to be useful or continue living.", clue: "Fixed idiom: a second ______ of life.", exp: "Fixed British/PSLE idiom: 'a second lease of life'." },
      { id: "c2025_39", phrase: "participate in", cat: "Verb & Preposition", sent: "Residents are encouraged to actively participate [ ______ ] community upcycling workshops.", correct: "in", options: ["in", "on", "at", "with"], meaning: "To take part in an activity.", clue: "Preposition following participate: participate ______.", exp: "The verb 'participate' strictly pairs with 'in'." },
      { id: "c2025_40", phrase: "lack of", cat: "Collocation", sent: "Many beginners give up DIY projects due to a [ ______ ] of space and proper tools at home.", correct: "lack", options: ["lack", "shortage", "loss", "need"], meaning: "The state of being without or not having enough of something.", clue: "Absence or insufficiency: a ______ of space.", exp: "Standard collocation: 'a lack of'." }
    ];

    let activeApp = 'spelling'; 
    let currentMode = 'daily';
    let currentIdx = 0;
    let selectedClozeOpt = null;
    let clozeFormat = 'mcq';
    let attemptNum = 1;
    let hasFinalSubmitted = false;
    let sessionList = [];
    let currentQuestion = null;
    let timerInterval = null;
    let timeLeft = 45;

    const todayStr = new Date().toISOString().split('T')[0];

    function getItemKey(item) {
      if (!item) return '';
      return item.word ? item.word : item.id;
    }

    function loadInitialStore() {
      let s = JSON.parse(localStorage.getItem('psle_master_store_v5') || '{}');
      if (!s.stars) {
        ['portal_spelling_v4', 'portal_spelling_v3', 'portal_cloze_v3'].forEach(k => {
          try {
            const old = JSON.parse(localStorage.getItem(k) || '{}');
            if (old.stars && old.stars > (s.stars || 0)) {
              s.stars = old.stars;
              if (old.mastered) s.mastered = old.mastered;
              if (old.inReview) s.inReview = old.inReview;
              if (old.progress) s.progress = old.progress;
            }
          } catch(e) {}
        });
      }
      return {
        stars: s.stars || 0,
        mastered: s.mastered || [],
        inReview: s.inReview || [],
        progress: s.progress || {},
        dailyLogs: s.dailyLogs || {}
      };
    }

    let store = loadInitialStore();

    if (dbRef) {
      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          store.stars = val.stars !== undefined ? val.stars : store.stars;
          store.mastered = val.mastered || [];
          store.inReview = val.inReview || [];
          store.progress = val.progress || {};
          store.dailyLogs = val.dailyLogs || {};
          saveToLocalStorage();
          updateStats();
        }
      });
    }

    function saveToLocalStorage() {
      localStorage.setItem('psle_master_store_v5', JSON.stringify(store));
    }

    function syncStore() {
      saveToLocalStorage();
      if (dbRef) {
        dbRef.set({
          stars: store.stars,
          mastered: store.mastered,
          inReview: store.inReview,
          progress: store.progress,
          dailyLogs: store.dailyLogs
        });
      }
    }

    function promptParentEdit() {
      const pwd = prompt("请输入家长管理密码：", "");
      if (pwd === "1234") {
        const val = prompt(`当前云端星星总数：${store.stars} ⭐\n请输入修改后的新星星数：`, store.stars);
        if (val !== null && !isNaN(val)) {
          store.stars = parseInt(val, 10);
          syncStore();
          updateStats();
          alert("星星已同步至所有设备！");
        }
      } else if (pwd !== null) {
        alert("密码错误！");
      }
    }

    function getDB() { 
      if (activeApp === 'speed') return [...SPELLING_DB, ...CLOZE_DB];
      return activeApp === 'spelling' ? SPELLING_DB : CLOZE_DB; 
    }

    function buildSessionList() {
      const db = getDB();

      if (activeApp === 'speed') {
        sessionList = db.slice(0, 15);
        return;
      }
      if (currentMode === 'review') {
        const rev = db.filter(item => store.inReview.includes(getItemKey(item)));
        sessionList = rev.length > 0 ? rev : db.slice(0, 20);
        return;
      }
      if (currentMode === 'daily') {
        const reviewDue = db.filter(item => {
          const key = getItemKey(item);
          const p = store.progress[key];
          return p && (!p.nextDue || p.nextDue <= todayStr) && p.streak < 3;
        });
        const unseen = db.filter(item => {
          const key = getItemKey(item);
          return !store.progress[key] && !store.mastered.includes(key);
        });
        let pool = [...reviewDue, ...unseen];
        if (pool.length < 20) {
          const nonMastered = db.filter(item => !store.mastered.includes(getItemKey(item)));
          pool = nonMastered.length >= 20 ? nonMastered : db;
        }
        sessionList = pool.slice(0, 20);
        return;
      }
      sessionList = db;
    }

    function getActiveList() {
      if (!sessionList || sessionList.length === 0) buildSessionList();
      return sessionList;
    }

    function switchApp(app) {
      clearInterval(timerInterval);
      activeApp = app;
      currentMode = 'daily';
      currentIdx = 0;
      ['swSpelling', 'swCloze', 'swSpeed'].forEach(id => {
        document.getElementById(id).className = 'app-btn';
      });
      document.getElementById('sw' + capitalize(app)).className = 'app-btn active ' + app;
      document.getElementById('actionBtn').className = 'btn ' + app;
      document.getElementById('tabFormat').style.display = (app === 'cloze') ? 'block' : 'none';
      document.getElementById('timerContainer').style.display = (app === 'speed') ? 'inline-flex' : 'none';
      buildSessionList();
      updateTabStyles();
      changeMode('daily');
    }

    function updateTabStyles() {
      ['tabDaily', 'tabReview', 'tabFormat', 'tabAll', 'tabHistory'].forEach(t => {
        const el = document.getElementById(t);
        const isActive = el.classList.contains('active');
        el.className = 'tab-pill' + (isActive ? ' active ' + activeApp : '');
      });
    }

    function toggleClozeFormat() {
      clozeFormat = (clozeFormat === 'mcq') ? 'open' : 'mcq';
      document.getElementById('formatLabel').innerText = (clozeFormat === 'mcq') ? 'MCQ' : 'Pro Open';
      renderQuestion();
    }

    function changeMode(mode) {
      clearInterval(timerInterval);
      currentMode = mode;
      currentIdx = 0;
      buildSessionList();

      ['tabDaily', 'tabReview', 'tabAll', 'tabHistory'].forEach(t => {
        const el = document.getElementById(t);
        const isTarget = (t === ('tab' + capitalize(mode)));
        el.className = 'tab-pill' + (isTarget ? ' active ' + activeApp : '');
      });

      if (mode === 'history') {
        document.getElementById('quizView').style.display = 'none';
        document.getElementById('btnContainer').style.display = 'none';
        document.getElementById('historyView').style.display = 'block';
        renderHistory();
      } else {
        document.getElementById('quizView').style.display = 'block';
        document.getElementById('btnContainer').style.display = 'block';
        document.getElementById('historyView').style.display = 'none';
        renderQuestion();
      }
    }

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function renderQuestion() {
      clearInterval(timerInterval);
      const list = getActiveList();
      if (currentIdx >= list.length) currentIdx = 0;
      currentQuestion = list[currentIdx] || list[0];
      const q = currentQuestion;
      const isSpellingItem = !!q.word;

      attemptNum = 1;
      hasFinalSubmitted = false;
      selectedClozeOpt = null;

      document.getElementById('qCategory').className = 'badge-cat ' + activeApp;
      document.getElementById('qCategory').innerText = q.cat;
      document.getElementById('qSource').innerText = isSpellingItem ? q.src : ("Target: " + q.phrase);
      document.getElementById('qIndex').innerText = (currentIdx + 1) + " / " + list.length;

      document.getElementById('qInstruction').innerText = isSpellingItem 
        ? "Identify and correct the bracketed error (Watch Capital letters & Tense!):" 
        : (clozeFormat === 'mcq' ? "Select the correct option to fill the Cloze blank:" : "Pro Mode: Type the exact word for the blank:");

      const formatted = isSpellingItem 
        ? q.sent.replace(/\[(.*?)\]/, '<span class="error-target">$1</span>')
        : (clozeFormat === 'mcq' 
            ? q.sent.replace(/\[\s*______\s*\]/, '<span class="blank-target">[ ______ ]</span>')
            : q.sent.replace(/\[\s*______\s*\]/, `<span class="blank-target">[ ${q.correct.charAt(0)}______ ]</span>`));
      
      document.getElementById('sentenceContainer').innerHTML = formatted;
      updateAttemptUI();

      const hintBtn = document.getElementById('hintBtn');
      hintBtn.disabled = true;
      hintBtn.style.color = '#94a3b8';
      hintBtn.style.cursor = 'not-allowed';
      hintBtn.innerText = '🔒 Hint (Locked)';
      document.getElementById('attemptTip').innerText = '🔒 Hint unlocks on 2nd attempt';
      document.getElementById('hintBox').style.display = 'none';
      document.getElementById('resultContainer').style.display = 'none';

      const spArea = document.getElementById('spellingInputArea');
      const mcqArea = document.getElementById('clozeOptionsArea');
      const proArea = document.getElementById('clozeProInputArea');
      const actionBtn = document.getElementById('actionBtn');

      if (isSpellingItem) {
        spArea.style.display = 'block';
        mcqArea.style.display = 'none';
        proArea.style.display = 'none';
        const input = document.getElementById('answerInput');
        input.value = '';
        input.disabled = false;
        input.focus();
        actionBtn.disabled = false;
        actionBtn.innerText = 'Check Answer (Attempt 1)';
      } else {
        spArea.style.display = 'none';
        if (clozeFormat === 'mcq') {
          mcqArea.style.display = 'grid';
          proArea.style.display = 'none';
          mcqArea.innerHTML = '';
          q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => selectClozeOpt(opt);
            btn.id = 'opt_' + idx;
            mcqArea.appendChild(btn);
          });
          actionBtn.disabled = true;
          actionBtn.innerText = 'Confirm Answer (Attempt 1)';
        } else {
          mcqArea.style.display = 'none';
          proArea.style.display = 'block';
          const pInput = document.getElementById('clozeProInput');
          pInput.value = '';
          pInput.disabled = false;
          pInput.focus();
          actionBtn.disabled = false;
          actionBtn.innerText = 'Submit Pro Answer';
        }
      }

      if (activeApp === 'speed') {
        startSpeedTimer();
      }

      updateStats();
    }

    function startSpeedTimer() {
      timeLeft = 45;
      document.getElementById('timerSec').innerText = timeLeft;
      timerInterval = setInterval(() => {
        timeLeft -= 1;
        document.getElementById('timerSec').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function handleTimeOut() {
      if (hasFinalSubmitted) return;
      const resBox = document.getElementById('resultContainer');
      resBox.className = 'result-box result-wrong';
      resBox.style.display = 'block';
      resBox.innerHTML = `<strong>⏰ Time is up!</strong> Over 45s elapsed. Moving to next question.`;
      hasFinalSubmitted = true;
      document.getElementById('actionBtn').innerText = 'Next Question →';
    }

    function updateAttemptUI() {
      const tag = document.getElementById('attemptDisplay');
      if (attemptNum === 1) {
        tag.className = 'attempt-tag attempt-1';
        tag.innerText = 'Attempt 1/2';
      } else {
        tag.className = 'attempt-tag attempt-2';
        tag.innerText = 'Attempt 2/2 (Hint Unlocked)';
      }
    }

    function selectClozeOpt(opt) {
      if (hasFinalSubmitted) return;
      selectedClozeOpt = opt;
      const q = currentQuestion;
      q.options.forEach((o, i) => {
        const el = document.getElementById('opt_' + i);
        if (el) el.className = 'opt-btn' + (o === opt ? ' selected' : '');
      });
      document.getElementById('actionBtn').disabled = false;
    }

    function unlockHint() {
      const hintBtn = document.getElementById('hintBtn');
      hintBtn.disabled = false;
      hintBtn.style.color = '#7e22ce';
      hintBtn.style.cursor = 'pointer';
      hintBtn.innerText = '💡 Read Hint Now';
      document.getElementById('attemptTip').innerText = '💡 Hint unlocked for 2nd attempt!';
    }

    function toggleHint() {
      const q = currentQuestion || getActiveList()[currentIdx];
      const hBox = document.getElementById('hintBox');
      if (hBox.style.display === 'none') {
        hBox.style.display = 'block';
        if (q.word) {
          hBox.innerHTML = '<strong>💡 Hint & Clue:</strong> ' + q.sub + '.<br>' + q.tip;
        } else {
          hBox.innerHTML = '<strong>💡 Context Clue:</strong> ' + q.clue + '<br><span style="color:#0369a1; font-weight:600;">Meaning:</span> ' + q.meaning;
        }
      } else {
        hBox.style.display = 'none';
      }
    }

    function speakTargetSentence() {
      if (!window.speechSynthesis) return;
      const q = currentQuestion || getActiveList()[currentIdx];
      let textToSpeak = '';
      if (q.word) {
        textToSpeak = q.sent.replace(/\[(.*?)\]/, q.word);
      } else {
        textToSpeak = q.sent.replace(/\[\s*______\s*\]/, " " + q.correct + " ");
      }
      const utter = new SpeechSynthesisUtterance(textToSpeak);
      utter.lang = 'en-GB';
      utter.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    function updateStats() {
      document.getElementById('statStars').innerText = store.stars || 0;
      
      const isSp = (activeApp === 'spelling');
      const isCl = (activeApp === 'cloze');
      
      const currentMasteredCount = store.mastered.filter(key => {
        const isWord = SPELLING_DB.some(item => item.word === key);
        return isSp ? isWord : (isCl ? !isWord : true);
      }).length;
      
      const currentReviewCount = store.inReview.filter(key => {
        const isWord = SPELLING_DB.some(item => item.word === key);
        return isSp ? isWord : (isCl ? !isWord : true);
      }).length;

      document.getElementById('statMastered').innerText = currentMasteredCount;
      document.getElementById('statReview').innerText = currentReviewCount;
      document.getElementById('revCount').innerText = currentReviewCount;

      const statLabelEl = document.getElementById('statDoneLabel');
      const statDoneEl = document.getElementById('statDone');
      const todayLog = store.dailyLogs[todayStr] || { done: 0, firstTryCorrect: 0, byApp: {} };
      const byApp = todayLog.byApp || {};
      
      if (activeApp === 'spelling') {
        statLabelEl.innerText = 'Editing Today';
        statDoneEl.style.color = '#7e22ce';
        const spDone = byApp.spelling || 0;
        statDoneEl.innerText = `${spDone}/20`;
      } else if (activeApp === 'cloze') {
        statLabelEl.innerText = 'Cloze Today';
        statDoneEl.style.color = '#0284c7';
        const clDone = byApp.cloze || 0;
        statDoneEl.innerText = `${clDone}/20`;
      } else {
        statLabelEl.innerText = 'Speed Today';
        statDoneEl.style.color = '#dc2626';
        const spdDone = byApp.speed || 0;
        statDoneEl.innerText = `${spdDone}/15`;
      }
    }

    function checkCapitalisationTrap(q, rawInput) {
      if (!q.sent.startsWith('[')) return null;
      if (rawInput.length > 0 && rawInput.charAt(0) !== rawInput.charAt(0).toUpperCase()) {
        return "⚠️ Capital Letter Alert: Words at the beginning of a sentence MUST start with a Capital Letter!";
      }
      return null;
    }

    function handleAction() {
      const list = getActiveList();
      const q = currentQuestion || list[currentIdx];
      const isSpellingItem = !!q.word;
      const targetAnswer = isSpellingItem ? q.word : q.correct;
      const idKey = getItemKey(q);
      const actionBtn = document.getElementById('actionBtn');
      const resBox = document.getElementById('resultContainer');

      if (hasFinalSubmitted) {
        if (currentIdx < list.length - 1) currentIdx += 1;
        else currentIdx = 0;
        renderQuestion();
        return;
      }

      let rawAns = '';
      if (isSpellingItem) {
        rawAns = document.getElementById('answerInput').value.trim();
        if (!rawAns) return;
      } else {
        if (clozeFormat === 'mcq') {
          if (!selectedClozeOpt) return;
          rawAns = selectedClozeOpt;
        } else {
          rawAns = document.getElementById('clozeProInput').value.trim();
          if (!rawAns) return;
        }
      }

      const userAns = rawAns.toLowerCase();
      const targetLower = targetAnswer.toLowerCase();
      const isTargetCorrect = (userAns === targetLower);
      const capWarning = checkCapitalisationTrap(q, rawAns);

      if (!store.dailyLogs[todayStr]) {
        store.dailyLogs[todayStr] = { done: 0, firstTryCorrect: 0, byApp: { spelling: 0, cloze: 0, speed: 0 } };
      }
      if (!store.dailyLogs[todayStr].byApp) {
        store.dailyLogs[todayStr].byApp = { spelling: 0, cloze: 0, speed: 0 };
      }
      if (!store.progress[idKey]) {
        store.progress[idKey] = { streak: 0, mistakes: 0, nextDue: todayStr };
      }
      let prog = store.progress[idKey];

      // Attempt 1
      if (attemptNum === 1) {
        if (isTargetCorrect) {
          clearInterval(timerInterval);
          hasFinalSubmitted = true;
          store.stars = (store.stars || 0) + 3;
          store.dailyLogs[todayStr].done += 1;
          store.dailyLogs[todayStr].firstTryCorrect += 1;
          store.dailyLogs[todayStr].byApp[activeApp] = (store.dailyLogs[todayStr].byApp[activeApp] || 0) + 1;
          
          prog.streak += 1;
          let interval = prog.streak === 1 ? 1 : (prog.streak === 2 ? 3 : 14);
          prog.nextDue = new Date(Date.now() + interval * 86400000).toISOString().split('T')[0];

          if (prog.streak >= 3) {
            if (!store.mastered.includes(idKey)) store.mastered.push(idKey);
            store.inReview = store.inReview.filter(x => x !== idKey);
          }

          revealCorrectUI(isSpellingItem, q);
          resBox.className = 'result-box result-correct';
          resBox.style.display = 'block';
          resBox.innerHTML = `<strong>🌟 Brilliant! 1st Attempt Correct! (+3 ⭐)</strong><br>
            ${capWarning ? `<div style="color:#c2410c; font-weight:700; margin:4px 0;">${capWarning}</div>` : ''}
            <span style="font-size:11px; color:#065f46;">Mastery Progress: ${prog.streak}/3 consecutive</span>
            <div class="tip-section">
              ${isSpellingItem ? `<strong>🔤 Structure:</strong> ${q.feat}<br><strong>💡 Rule:</strong> ${q.tip}` : `<strong>📖 Meaning:</strong> ${q.meaning}<br><strong>🔍 Analysis:</strong> ${q.exp}`}
            </div>`;
          actionBtn.innerText = 'Next Question →';
        } else {
          attemptNum = 2;
          updateAttemptUI();
          unlockHint();
          toggleHint();

          resBox.className = 'result-box result-retry';
          resBox.style.display = 'block';
          resBox.innerHTML = `<strong>⚠️ Not quite right! Hint Unlocked 💡</strong><br>Read the clue above and make your <strong>Attempt 2</strong>!`;

          if (isSpellingItem) {
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
          } else if (clozeFormat === 'open') {
            document.getElementById('clozeProInput').value = '';
            document.getElementById('clozeProInput').focus();
          }
          actionBtn.innerText = 'Check Answer (Attempt 2)';
        }
        syncStore();
        updateStats();
        return;
      }

      // Attempt 2
      if (attemptNum === 2) {
        clearInterval(timerInterval);
        hasFinalSubmitted = true;
        store.dailyLogs[todayStr].done += 1;
        store.dailyLogs[todayStr].byApp[activeApp] = (store.dailyLogs[todayStr].byApp[activeApp] || 0) + 1;

        if (isTargetCorrect) {
          store.stars = (store.stars || 0) + 1;
          prog.nextDue = todayStr;

          revealCorrectUI(isSpellingItem, q);
          resBox.className = 'result-box result-correct';
          resBox.style.display = 'block';
          resBox.innerHTML = `<strong>✅ Good recovery on Attempt 2! (+1 ⭐)</strong><br>
            ${capWarning ? `<div style="color:#c2410c; font-weight:700; margin:4px 0;">${capWarning}</div>` : ''}
            <div class="tip-section">
              ${isSpellingItem ? `<strong>🔤 Structure:</strong> ${q.feat}<br><strong>💡 Tip:</strong> ${q.tip}` : `<strong>📖 Meaning:</strong> ${q.meaning}<br><strong>🔍 Analysis:</strong> ${q.exp}`}
            </div>`;
        } else {
          prog.streak = 0;
          prog.mistakes += 1;
          prog.nextDue = todayStr;

          if (!store.inReview.includes(idKey)) store.inReview.push(idKey);
          store.mastered = store.mastered.filter(x => x !== idKey);

          revealWrongUI(isSpellingItem, q, userAns);
          resBox.className = 'result-box result-wrong';
          resBox.style.display = 'block';
          resBox.innerHTML = `<strong>❌ Missed both attempts. Added to Review!</strong><br>
            Correct Answer: <strong style="font-size:15px; text-decoration:underline;">${targetAnswer}</strong>
            <div class="tip-section">
              ${isSpellingItem ? `<strong>⚠️ Pitfall:</strong> ${q.feat}<br><strong>🎯 Key Rule:</strong> ${q.tip}` : `<strong>📖 Target Phrase:</strong> ${q.phrase} (${q.meaning})<br><strong>⚠️ Why:</strong> ${q.exp}`}
            </div>`;
        }

        syncStore();
        updateStats();
        actionBtn.innerText = 'Next Question →';
      }
    }

    function revealCorrectUI(isSpellingItem, q) {
      if (isSpellingItem) document.getElementById('answerInput').disabled = true;
      else if (clozeFormat === 'mcq') {
        q.options.forEach((o, i) => {
          const el = document.getElementById('opt_' + i);
          if (el && o.toLowerCase() === q.correct.toLowerCase()) el.className = 'opt-btn correct';
        });
      } else document.getElementById('clozeProInput').disabled = true;
    }

    function revealWrongUI(isSpellingItem, q, userAns) {
      if (isSpellingItem) document.getElementById('answerInput').disabled = true;
      else if (clozeFormat === 'mcq') {
        q.options.forEach((o, i) => {
          const el = document.getElementById('opt_' + i);
          if (el) {
            el.disabled = true;
            if (o.toLowerCase() === q.correct.toLowerCase()) el.className = 'opt-btn correct';
            else if (o.toLowerCase() === userAns.toLowerCase()) el.className = 'opt-btn wrong';
          }
        });
      } else document.getElementById('clozeProInput').disabled = true;
    }

    function openPrintModal() {
      const container = document.getElementById('printListContainer');
      const allDB = getDB();
      const weakList = allDB.filter(item => store.inReview.includes(getItemKey(item)));
      const printPool = (weakList.length >= 5 ? weakList : allDB).slice(0, 15);

      let html = '';
      printPool.forEach((item, idx) => {
        const sentenceWithLine = item.sent 
          ? item.sent.replace(/\[.*?\]/, '____________________')
          : `Fill in the blank: ${item.phrase} ____________________`;
        
        html += `<div class="worksheet-item">
          <strong>${idx + 1}.</strong> ${sentenceWithLine}
          <div style="font-size:10pt; color:#666; margin-top:4px;">(Category: ${item.cat} | Clue: ${item.sub || item.meaning})</div>
        </div>`;
      });
      container.innerHTML = html;
      window.print();
    }

    function renderHistory() {
      const container = document.getElementById('historyListContainer');
      const dates = Object.keys(store.dailyLogs).sort().reverse();
      if (dates.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; font-size:13px; text-align:center;">No practice records yet.</p>';
        return;
      }
      let html = '';
      dates.forEach(d => {
        const log = store.dailyLogs[d];
        const byApp = log.byApp || {};
        const acc = log.done > 0 ? Math.round((log.firstTryCorrect / log.done) * 100) : 0;
        html += `<div class="history-card" style="display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:12px; padding:10px 12px; border:1px solid #f1f5f9; margin-bottom:6px;">
          <div>
            <strong style="color:#0f172a; font-size:13px;">${d}</strong>
            <div style="color:#64748b; font-size:11px; margin-top:2px;">
              Editing: <strong>${byApp.spelling || 0}</strong> | Cloze: <strong>${byApp.cloze || 0}</strong> | Total 1st-Try: <strong>${log.firstTryCorrect || 0}</strong>
            </div>
          </div>
          <div style="text-align:right;">
            <span style="font-size:15px; font-weight:800; color:${acc >= 80 ? '#059669' : '#d97706'};">${acc}%</span>
          </div>
        </div>`;
      });
      container.innerHTML = html;
    }

    document.getElementById('answerInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') handleAction(); });
    document.getElementById('clozeProInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') handleAction(); });

    renderQuestion();
  </script>
</body>
</html>
